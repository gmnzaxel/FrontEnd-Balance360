name: CI/CD Pipeline - Frontend (Netlify Deploy)

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  # =========================================================================
  # STAGE 1: Quality Gate & DevSecOps Security Scan
  # =========================================================================
  test-and-lint:
    name: 1.1 Quality Gate (Lint, Tests & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Test Production Build
        run: npm run build

  security-scan:
    name: 1.2 Security Vulnerability Scan (Grype & Snyk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Grype Vulnerability Scan
        uses: anchore/scan-action@v6
        with:
          path: "."
          fail-build: false
          severity-cutoff: high
          output-format: table

      - name: Run Snyk Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "Iniciando escaneo de vulnerabilidades con Snyk..."
            npm install -g snyk
            snyk test --severity-threshold=high || echo "Snyk detectó advertencias de seguridad"
          else
            echo "⚠️ [Snyk] Secreto SNYK_TOKEN no configurado en los Secretos del repositorio. Omitiendo Snyk."
          fi

  # =========================================================================
  # STAGE 2: Semantic Versioning & Release Tagging
  # =========================================================================
  version-and-release:
    name: 2. Semantic Versioning & Git Release
    needs: [test-and-lint, security-scan]
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
      !contains(github.event.head_commit.message, '/deploy')
    outputs:
      skip_deploy: ${{ steps.meta.outputs.skip_deploy }}
      new_tag: ${{ steps.meta.outputs.image_tag }}
      latest_tag: ${{ steps.meta.outputs.latest_tag }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Semantic Version from Commit Message
        id: meta
        run: |
          python3 - << 'EOF'
          import os
          import re
          import subprocess

          msg = os.environ.get("COMMIT_MSG", "").lower()
          ref = os.environ.get("GITHUB_REF", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          repo = os.environ.get("REPO_NAME", "").lower().replace("_", "-")

          # Obtener último tag existente de Git
          try:
              latest_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0"], stderr=subprocess.DEVNULL
              ).decode().strip()
          except Exception:
              latest_tag = "1.0.0"

          has_v = latest_tag.startswith("v")
          clean_tag = latest_tag.lstrip("v")
          parts = clean_tag.split(".")

          try:
              major = int(parts[0]) if len(parts) > 0 else 1
              minor = int(parts[1]) if len(parts) > 1 else 0
              patch = int(parts[2]) if len(parts) > 2 else 0
          except ValueError:
              major, minor, patch = 1, 0, 0

          # Reglas de versionado semántico según Conventional Commits
          is_feat = bool(re.search(r"\bfeat(\(.*\))?:", msg) or "feat(" in msg)
          is_fix_or_refactor = bool(re.search(r"\b(fix|refactor)(\(.*\))?:", msg) or "fix(" in msg or "refactor(" in msg)
          is_skip_deploy = bool(
              re.search(r"\b(chore|doc|docs)(\(.*\))?:", msg)
              or "chore(" in msg
              or "doc(" in msg
              or "docs(" in msg
              or "/notdeploy" in msg
          )

          # Calcular nuevo tag
          if ref.startswith("refs/tags/"):
              tag = ref_name
          elif is_feat:
              minor += 1
              patch = 0
              tag = f"v{major}.{minor}.{patch}" if has_v else f"{major}.{minor}.{patch}"
          elif is_fix_or_refactor:
              patch += 1
              tag = f"v{major}.{minor}.{patch}" if has_v else f"{major}.{minor}.{patch}"
          else:
              tag = latest_tag

          print(f"Commit message: {msg}")
          print(f"Tag anterior: {latest_tag} -> Nuevo Tag: {tag}")
          print(f"Skip deploy: {is_skip_deploy}")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"repo_name={repo}\n")
                  f.write(f"image_tag={tag}\n")
                  f.write(f"latest_tag={latest_tag}\n")
                  f.write(f"skip_deploy={'true' if is_skip_deploy else 'false'}\n")
          EOF
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.event.repository.name }}

      - name: Push New Git Tag to Repository
        if: github.ref == 'refs/heads/main' && steps.meta.outputs.image_tag != steps.meta.outputs.latest_tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.meta.outputs.image_tag }}" || true
          git push origin "${{ steps.meta.outputs.image_tag }}" --force || echo "Tag already pushed"

  # =========================================================================
  # STAGE 3: Deploy to Netlify
  # - Se omite automáticamente si es chore(), doc(), docs() o /notdeploy
  # =========================================================================
  deploy:
    name: 3. Deploy to Netlify
    needs: version-and-release
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.version-and-release.outputs.skip_deploy != 'true' &&
      !contains(github.event.head_commit.message, '/notdeploy') &&
      (
        needs.version-and-release.result == 'success' ||
        contains(github.event.head_commit.message, '/deploy')
      )
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_ENV: "production"
        run: npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "Instalando Netlify CLI..."
            npm install -g netlify-cli
            echo "Desplegando en Netlify (Tag: ${{ needs.version-and-release.outputs.new_tag }})..."
            netlify deploy --prod --dir=dist --auth="$NETLIFY_AUTH_TOKEN" --site="$NETLIFY_SITE_ID" --message="Deploy commit ${{ github.sha }} (${{ needs.version-and-release.outputs.new_tag }})"
            echo "✅ Despliegue en Netlify completado exitosamente."
          else
            echo "⚠️ [Netlify] Secretos NETLIFY_AUTH_TOKEN o NETLIFY_SITE_ID no configurados en los Secretos del repositorio."
            echo "ℹ️ Si tu sitio en Netlify está conectado directamente al repositorio de GitHub, Netlify detectará el push a 'main' y compilará automáticamente."
          fi
